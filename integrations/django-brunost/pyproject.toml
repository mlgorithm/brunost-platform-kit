[project]
name = "django-brunost"
version = "0.1.0"
description = "Django integration for Brunost competition platforms"
requires-python = ">=3.11"
dependencies = ["Django>=4.2,<6", "brunost-platform-kit>=0.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
